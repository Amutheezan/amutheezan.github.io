# Research areas shown on the homepage research-areas grid.
# Current postdoc focus areas are listed first; PhD-era work (RL,
# combinatorial optimization, transportation) follows.

- title: "Vulnerability Dataset Quality"
  icon: "fas fa-database"
  anchor: "vulnerability-dataset-quality"
  description: "Curating and evaluating the data quality of software vulnerability detection datasets."

- title: "Label Error Detection Robustness"
  icon: "fas fa-tags"
  anchor: "label-error-detection-robustness"
  description: "Studying the effectiveness of label error detection tools in the presence of near-duplicate and deliberately altered samples."

- title: "Software Vulnerability Repair"
  icon: "fas fa-wrench"
  anchor: "software-vulnerability-repair"
  description: "Automated repair of software vulnerabilities."

- title: "Figure-of-Speech-Aware Deception Detection"
  icon: "fas fa-user-secret"
  anchor: "deception-detection"
  description: "Detecting deceptive intent with methods that account for figures of speech."

- title: "Reinforcement Learning"
  icon: "fas fa-brain"
  anchor: "reinforcement-learning"
  description: "Deep RL for sequential decision-making, including actor-critic agents with transformers for variable-dimensional, large discrete action spaces."

- title: "Combinatorial Optimization"
  icon: "fas fa-cogs"
  anchor: "combinatorial-optimization"
  description: "Problem formulations and mathematical models for large-scale routing, scheduling, and resource-allocation problems, paired with learning-guided search."

- title: "Multi-Agent Systems"
  icon: "fas fa-robot"
  anchor: "multi-agent-systems"
  description: "Hierarchical, coordinated multi-agent approaches, such as repositioning emergency responders across regions to reduce response times."

- title: "Cyber-Physical Systems"
  icon: "fas fa-microchip"
  anchor: "cyber-physical-systems"
  description: "Real-time decision-making for physical infrastructure, including on-demand transit fleets, ambulance stationing, and dynamic vehicle routing."
