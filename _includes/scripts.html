<!-- Mobile nav menu toggle — flat dropdown, no hamburger icon -->
<script>
(function () {
  var menuBtn = document.getElementById('nav-menu-btn');
  var navLinks = document.getElementById('nav-links');
  if (!menuBtn || !navLinks) { return; }

  function closeMenu() {
    navLinks.classList.remove('is-open');
    menuBtn.setAttribute('aria-expanded', 'false');
  }

  menuBtn.addEventListener('click', function () {
    var open = navLinks.classList.toggle('is-open');
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  navLinks.addEventListener('click', function (e) {
    if (e.target.tagName === 'A') { closeMenu(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeMenu(); }
  });
})();
</script>

<!-- Dark mode toggle — single accent, no drawer -->
<script>
(function () {
  var btn   = document.getElementById('theme-toggle-btn');
  var icon  = document.getElementById('theme-toggle-icon');
  var label = document.getElementById('theme-toggle-label');
  if (!btn) return;

  function setToggleVisual(isDark) {
    btn.setAttribute('aria-checked', isDark ? 'true' : 'false');
    if (icon)  { icon.className = isDark ? 'fas fa-moon' : 'fas fa-sun'; }
    if (label) { label.textContent = isDark ? 'Dark' : 'Light'; }
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    setToggleVisual(theme === 'dark');
    try { localStorage.setItem('theme', theme); } catch(e) {}
  }

  /* Restore saved preference — default: dark */
  (function () {
    var saved;
    try { saved = localStorage.getItem('theme'); } catch(e) {}
    var isDark = saved !== null ? saved === 'dark' : true;
    applyTheme(isDark ? 'dark' : 'light');
  })();

  btn.addEventListener('click', function () {
    var currentlyDark = document.documentElement.getAttribute('data-theme') === 'dark';
    applyTheme(currentlyDark ? 'light' : 'dark');
  });
})();
</script>

<!-- Publication / Project link button icons -->
<script>
(function () {
  var ICON_MAP = [
    { test: /^arxiv$/,                    icon: 'fas fa-file-alt'       },
    { test: /^paper$/,                    icon: 'fas fa-file-pdf'       },
    { test: /^appendix$/,                 icon: 'fas fa-paperclip'      },
    { test: /^openreview$/,               icon: 'fas fa-comments'       },
    { test: /^pmlr$/,                     icon: 'fas fa-graduation-cap' },
    { test: /code/,                       icon: 'fab fa-github'         },
    { test: /shortvideo|short.?video/i,   icon: 'fab fa-youtube'        },
    { test: /video|talk/,                 icon: 'fab fa-youtube'        },
    { test: /poster/,                     icon: 'fas fa-image'          },
    { test: /slides?/,                    icon: 'fas fa-chalkboard'     }
  ];

  var URL_MAP = [
    { test: /github\.com/,               icon: 'fab fa-github'         },
    { test: /youtu/,                     icon: 'fab fa-youtube'        },
    { test: /arxiv\.org/,                icon: 'fas fa-file-alt'       },
    { test: /openreview\.net/,           icon: 'fas fa-comments'       },
    { test: /mlr\.press/,               icon: 'fas fa-graduation-cap' },
    { test: /figshare\.com/,            icon: 'fas fa-database'       }
  ];

  function iconForLink(label, href) {
    var key = label.toLowerCase().replace(/[\[\]\s]/g, '');
    var i, j;
    for (i = 0; i < ICON_MAP.length; i++) {
      if (ICON_MAP[i].test.test(key)) return ICON_MAP[i].icon;
    }
    for (j = 0; j < URL_MAP.length; j++) {
      if (URL_MAP[j].test.test(href)) return URL_MAP[j].icon;
    }
    return 'fas fa-external-link-alt';
  }

  document.addEventListener('DOMContentLoaded', function () {
    var anchors = document.querySelectorAll('.page__content a, .archive__item-body a');
    anchors.forEach(function (a) {
      var raw = a.textContent.trim();
      if (!/^\[.+\]$/.test(raw)) return;
      var label = raw.slice(1, -1);
      var iconClass = iconForLink(raw, a.href);
      a.classList.add('pub-link');
      a.setAttribute('title', label);
      a.innerHTML =
        '<span class="pub-link__icon"><i class="' + iconClass + '" aria-hidden="true"></i></span>' +
        '<span class="pub-link__label">' + label + '</span>';
    });
  });
})();
</script>

<!-- Citation box: format tabs + copy to clipboard -->
<script>
(function () {
  function setCopied(btn) {
    var label = btn.querySelector('.cite-box__copy-label');
    var icon = btn.querySelector('i');
    var originalLabel = label.textContent;
    var originalIcon = icon.className;
    label.textContent = 'Copied';
    icon.className = 'fas fa-check';
    btn.classList.add('is-copied');
    setTimeout(function () {
      label.textContent = originalLabel;
      icon.className = originalIcon;
      btn.classList.remove('is-copied');
    }, 1600);
  }

  function copyText(text, btn) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { setCopied(btn); });
      return;
    }
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    setCopied(btn);
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.cite-box').forEach(function (box) {
      var tabs = box.querySelectorAll('.cite-box__tab');
      var panels = box.querySelectorAll('.cite-box__panel');

      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          var target = tab.getAttribute('data-cite-tab');
          tabs.forEach(function (t) {
            t.classList.toggle('is-active', t === tab);
            t.setAttribute('aria-selected', t === tab ? 'true' : 'false');
          });
          panels.forEach(function (p) {
            p.hidden = p.getAttribute('data-cite-panel') !== target;
          });
        });
      });

      box.querySelectorAll('.cite-box__copy').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var panel = btn.closest('.cite-box__panel');
          var text = panel.querySelector('.cite-box__text').textContent.trim();
          copyText(text, btn);
        });
      });
    });
  });
})();
</script>

<!-- Search (Lunr.js) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/lunr.js/2.3.9/lunr.min.js"></script>
<script>
(function () {
  var openBtn  = document.getElementById('srch-open-btn');
  var overlay  = document.getElementById('srch-overlay');
  var modal    = document.getElementById('srch-modal');
  var input    = document.getElementById('srch-input');
  var results  = document.getElementById('srch-results');
  if (!modal) { return; }

  var idx    = null;
  var docs   = {};
  var active = -1;
  var loaded = false;

  var LABELS = { publications:'Publication', talks:'Talk', workshops:'Workshop', projects:'Project', posts:'Blog post' };
  var ICONS  = { publications:'fas fa-file-alt', talks:'fas fa-microphone', workshops:'fas fa-chalkboard-teacher', projects:'fas fa-code', posts:'fas fa-pen' };

  function openModal() {
    modal.classList.add('open');
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    input.focus();
    if (!loaded) { loadIndex(); }
  }

  function closeModal() {
    modal.classList.remove('open');
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    input.value = '';
    showEmpty('Start typing to search…');
    active = -1;
  }

  function showEmpty(msg) {
    results.innerHTML = '<div class="srch-empty"><i class="fas fa-search" aria-hidden="true"></i><span>' + msg + '</span></div>';
  }

  function loadIndex() {
    loaded = true;
    showEmpty('Loading…');
    fetch('{{ base_path }}/search.json')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        data.forEach(function (d) { docs[d.id] = d; });
        idx = lunr(function () {
          this.ref('id');
          this.field('title',    { boost: 10 });
          this.field('venue',    { boost: 5  });
          this.field('citation', { boost: 7  });
          this.field('content');
          data.forEach(function (d) { this.add(d); }, this);
        });
        showEmpty('Start typing to search…');
      })
      .catch(function () { showEmpty('Could not load search index.'); });
  }

  function highlight(text, terms) {
    if (!terms || !terms.length) { return text; }
    var re = new RegExp('(' + terms.map(function (w) { return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')', 'gi');
    return text.replace(re, '<mark>$1</mark>');
  }

  function render(q) {
    if (!q || !idx) { showEmpty('Start typing to search…'); return; }
    var terms = q.trim().split(/\s+/).filter(Boolean);
    var hits;
    try { hits = idx.search(terms.map(function (t) { return t + ' ' + t + '*'; }).join(' ')); } catch (e) { hits = []; }
    if (!hits.length) { showEmpty('No results for “' + q + '”'); return; }
    var grouped = {};
    hits.slice(0, 14).forEach(function (h) {
      var d = docs[h.ref];
      if (!d) { return; }
      (grouped[d.collection] = grouped[d.collection] || []).push(d);
    });
    var html = '';
    ['publications','talks','workshops','projects','posts'].forEach(function (col) {
      if (!grouped[col]) { return; }
      html += '<div class="srch-group-label">' + (LABELS[col] || col) + 's</div>';
      grouped[col].forEach(function (d) {
        var meta = [d.venue, d.date].filter(Boolean).join(' · ');
        var authors = '';
        if (d.citation) {
          var m = d.citation.match(/^([^(]+)\(/);
          if (m) { authors = m[1].trim().replace(/,?\s*$/, ''); }
        }
        html += '<a class="srch-item" href="' + d.url + '">' +
          '<div class="srch-item__type"><i class="' + (ICONS[d.collection] || 'fas fa-file') + '" aria-hidden="true"></i>' + (LABELS[d.collection] || d.collection) + '</div>' +
          '<div class="srch-item__title">' + highlight(d.title, terms) + '</div>' +
          (authors ? '<div class="srch-item__authors">' + highlight(authors, terms) + '</div>' : '') +
          (meta ? '<div class="srch-item__meta">' + meta + '</div>' : '') +
          '</a>';
      });
    });
    results.innerHTML = html;
    active = -1;
  }

  var timer;
  input.addEventListener('input', function () {
    clearTimeout(timer);
    var q = input.value.trim();
    timer = setTimeout(function () { render(q); }, 130);
  });

  input.addEventListener('keydown', function (e) {
    var items = results.querySelectorAll('.srch-item');
    if (!items.length) { return; }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      active = Math.min(active + 1, items.length - 1);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      active = Math.max(active - 1, 0);
    } else if (e.key === 'Enter' && active >= 0 && items[active]) {
      window.location.href = items[active].getAttribute('href');
      return;
    } else { return; }
    items.forEach(function (el, i) { el.classList.toggle('srch-item--active', i === active); });
    if (items[active]) { items[active].scrollIntoView({ block: 'nearest' }); }
  });

  openBtn.addEventListener('click', openModal);
  overlay.addEventListener('click', closeModal);
  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      if (modal.classList.contains('open')) { closeModal(); } else { openModal(); }
    }
    if (e.key === 'Escape' && modal.classList.contains('open')) { closeModal(); }
  });
})();
</script>
