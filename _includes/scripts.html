<!-- Dark / Light mode toggle -->
<script>
(function () {
  var toggle = document.getElementById('dark-mode-toggle');
  if (!toggle) return;

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('theme', theme); } catch(e) {}
  }

  toggle.addEventListener('click', function () {
    var current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });
})();
</script>

<!-- Color theme switcher — each swatch dot selects its theme directly -->
<script>
(function () {
  var colorToggle = document.getElementById('color-theme-toggle');
  if (!colorToggle) return;

  function applyColorTheme(theme) {
    if (theme === 'default') {
      document.documentElement.removeAttribute('data-color-theme');
    } else {
      document.documentElement.setAttribute('data-color-theme', theme);
    }
    try { localStorage.setItem('color-theme', theme); } catch(e) {}
  }

  /* Each swatch <button> carries its own data-color-theme — click sets it directly */
  colorToggle.addEventListener('click', function (e) {
    var swatch = e.target.closest('[data-color-theme]');
    if (!swatch) return;
    applyColorTheme(swatch.getAttribute('data-color-theme'));
  });
})();
</script>

<!-- Publication / Project link button icons -->
<script>
(function () {
  /* Map label text (lower-cased, brackets stripped) → Font Awesome classes */
  var ICON_MAP = [
    { test: /^arxiv$/,                    icon: 'fas fa-file-alt'       },
    { test: /^paper$/,                    icon: 'fas fa-file-pdf'       },
    { test: /^appendix$/,                 icon: 'fas fa-paperclip'      },
    { test: /^openreview$/,               icon: 'fas fa-comments'       },
    { test: /^pmlr$/,                     icon: 'fas fa-graduation-cap' },
    { test: /code/,                       icon: 'fab fa-github'         },
    { test: /shortvideo|short.?video/i,   icon: 'fab fa-youtube'        },
    { test: /video|talk/,                 icon: 'fab fa-youtube'        },
    { test: /poster/,                     icon: 'fas fa-image'          },
    { test: /slides?/,                    icon: 'fas fa-chalkboard'     }
  ];

  /* Fallback: guess icon from URL if label didn't match */
  var URL_MAP = [
    { test: /github\.com/,               icon: 'fab fa-github'         },
    { test: /youtu/,                     icon: 'fab fa-youtube'        },
    { test: /arxiv\.org/,               icon: 'fas fa-file-alt'       },
    { test: /openreview\.net/,           icon: 'fas fa-comments'       },
    { test: /mlr\.press/,               icon: 'fas fa-graduation-cap' },
    { test: /figshare\.com/,            icon: 'fas fa-database'       }
  ];

  function iconForLink(label, href) {
    var key = label.toLowerCase().replace(/[\[\]\s]/g, '');
    for (var i = 0; i < ICON_MAP.length; i++) {
      if (ICON_MAP[i].test.test(key)) return ICON_MAP[i].icon;
    }
    for (var j = 0; j < URL_MAP.length; j++) {
      if (URL_MAP[j].test.test(href)) return URL_MAP[j].icon;
    }
    return 'fas fa-external-link-alt';
  }

  document.addEventListener('DOMContentLoaded', function () {
    var anchors = document.querySelectorAll('.page__content a, .archive__item-body a');
    anchors.forEach(function (a) {
      var raw = a.textContent.trim();
      /* Only decorate links whose visible text is exactly [Label] */
      if (!/^\[.+\]$/.test(raw)) return;

      var label = raw.slice(1, -1);   /* strip [ ] */
      var iconClass = iconForLink(raw, a.href);

      a.classList.add('pub-link');
      a.setAttribute('title', label);
      a.innerHTML =
        '<span class="pub-link__icon"><i class="' + iconClass + '" aria-hidden="true"></i></span>' +
        '<span class="pub-link__label">' + label + '</span>';
    });
  });
})();
</script>

<!-- Liquid Glass — slider widget + dynamic CSS var driver -->
<script>
(function () {

  /* ── SVG filter for liquid-surface ripple distortion ── */
  var svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svgEl.setAttribute('id', 'lg-svg-defs');
  svgEl.setAttribute('style', 'position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;');
  svgEl.innerHTML =
    '<defs>' +
      '<filter id="lg-liquid" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">' +
        '<feTurbulence id="lg-turb" type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="3" seed="4" result="noise"/>' +
        '<feDisplacementMap id="lg-disp" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G"/>' +
      '</filter>' +
    '</defs>';
  document.body.appendChild(svgEl);

  /* ── Inject a ripple-surface overlay on the masthead ── */
  var masthead = document.querySelector('.masthead');
  var lgRipple = null;
  if (masthead) {
    lgRipple = document.createElement('div');
    lgRipple.id = 'lg-ripple';
    lgRipple.style.cssText =
      'position:absolute;inset:0;pointer-events:none;z-index:0;opacity:0;' +
      'background:linear-gradient(125deg,' +
        'rgba(255,255,255,0.12) 0%,' +
        'rgba(255,255,255,0.04) 35%,' +
        'rgba(255,255,255,0.10) 65%,' +
        'rgba(255,255,255,0.02) 100%);' +
      'filter:url(#lg-liquid);' +
      'mix-blend-mode:overlay;' +
      'transition:opacity 0.5s ease;';
    masthead.appendChild(lgRipple);
  }

  /* ── Inject ripple overlay on sidebar too ── */
  var sidebar = document.querySelector('.sidebar');
  var lgRippleSide = null;
  if (sidebar) {
    lgRippleSide = document.createElement('div');
    lgRippleSide.id = 'lg-ripple-side';
    lgRippleSide.style.cssText =
      'position:absolute;inset:0;pointer-events:none;z-index:0;opacity:0;' +
      'border-radius:18px;' +
      'background:linear-gradient(155deg,' +
        'rgba(255,255,255,0.16) 0%,' +
        'rgba(255,255,255,0.04) 50%,' +
        'rgba(255,255,255,0.12) 100%);' +
      'filter:url(#lg-liquid);' +
      'mix-blend-mode:overlay;' +
      'transition:opacity 0.5s ease;';
    sidebar.appendChild(lgRippleSide);
  }

  /* ── Build slider widget ── */
  var control = document.createElement('div');
  control.id = 'lg-control';

  var panel = document.createElement('div');
  panel.id = 'lg-panel';
  panel.innerHTML =
    '<p id="lg-panel-title">&#x2728; Liquidity</p>' +
    '<div class="lg-row">' +
      '<span class="lg-icon">&#x25CB;</span>' +
      '<input id="lg-liquidity" type="range" min="0" max="100" value="30" step="1">' +
      '<span id="lg-value-badge">30</span>' +
    '</div>' +
    '<div class="lg-labels"><span>Solid</span><span>Liquid</span></div>';

  var toggleBtn = document.createElement('button');
  toggleBtn.id = 'lg-toggle-btn';
  toggleBtn.setAttribute('aria-label', 'Toggle liquidity controls');
  toggleBtn.setAttribute('title', 'Adjust glass liquidity');
  toggleBtn.innerHTML = '&#x1F4A7;';

  control.appendChild(panel);
  control.appendChild(toggleBtn);
  document.body.appendChild(control);

  var slider = document.getElementById('lg-liquidity');
  var valueBadge = document.getElementById('lg-value-badge');
  var panelIsOpen = false;

  /* ── Toggle panel open / close ── */
  toggleBtn.addEventListener('click', function () {
    panelIsOpen = !panelIsOpen;
    if (panelIsOpen) {
      panel.classList.add('is-open');
      toggleBtn.classList.add('is-open');
    } else {
      panel.classList.remove('is-open');
      toggleBtn.classList.remove('is-open');
    }
  });

  /* ── Linear interpolation helper ── */
  function lerp(a, b, t) { return a + (b - a) * t; }

  /* ── Map slider 0..100 to all glass CSS vars ── */
  function applyLiquidity(v) {
    var t = v / 100;

    var blur       = lerp(6,   54,  t).toFixed(1);
    var saturate   = lerp(108, 240, t).toFixed(0);
    var brightness = lerp(1.00, 1.07, t).toFixed(3);
    var fillOp     = lerp(0.06, 0.28, t).toFixed(3);
    var borderOp   = lerp(0.18, 0.65, t).toFixed(3);
    var shimmerOp  = lerp(0.00, 0.30, t).toFixed(3);
    var shimmerSpd = lerp(14,   3.5, t).toFixed(1);   /* faster = more liquid */
    var distort    = lerp(0,    30,  t).toFixed(1);   /* SVG displacement scale */

    var root = document.documentElement;
    root.style.setProperty('--lg-blur',        blur + 'px');
    root.style.setProperty('--lg-saturate',    saturate + '%');
    root.style.setProperty('--lg-brightness',  brightness);
    root.style.setProperty('--lg-fill-op',     fillOp);
    root.style.setProperty('--lg-border-op',   borderOp);
    root.style.setProperty('--lg-shimmer-op',  shimmerOp);
    root.style.setProperty('--lg-shimmer-spd', shimmerSpd + 's');

    /* Update SVG displacement scale */
    var disp = document.getElementById('lg-disp');
    if (disp) { disp.setAttribute('scale', distort); }

    /* Show / hide the ripple overlays proportionally */
    var rippleOp = lerp(0, 0.9, t).toFixed(2);
    if (lgRipple)     { lgRipple.style.opacity     = rippleOp; }
    if (lgRippleSide) { lgRippleSide.style.opacity = rippleOp; }

    /* Update slider track gradient */
    var pct = v + '%';
    slider.style.background =
      'linear-gradient(to right,' +
      '#6366f1 0%, #6366f1 ' + pct + ',' +
      'rgba(99,102,241,0.18) ' + pct + ', rgba(99,102,241,0.18) 100%)';

    /* Update badge */
    if (valueBadge) { valueBadge.textContent = v; }

    /* Persist */
    try { localStorage.setItem('lg-liquidity', v); } catch(e) {}
  }

  /* ── Wire slider ── */
  slider.addEventListener('input', function () {
    applyLiquidity(parseInt(this.value, 10));
  });

  /* ── Restore saved value ── */
  var saved = 30;
  try {
    var s = localStorage.getItem('lg-liquidity');
    if (s !== null) { saved = Math.max(0, Math.min(100, parseInt(s, 10))); }
  } catch(e) {}
  slider.value = saved;
  applyLiquidity(saved);

})();
</script>
