{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button id="greedy-nav-btn" class="greedy-nav__toggle-btn"><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
          <li class="masthead__menu-item masthead__menu-item--toggle" data-no-collapse>
            <div class="color-theme-toggle" id="color-theme-toggle" aria-label="Switch color theme" title="Pick a colour theme">
              <button class="color-theme-swatch color-theme-swatch--default" data-color-theme="default" aria-label="Blue theme" title="Blue"></button>
              <button class="color-theme-swatch color-theme-swatch--indigo"  data-color-theme="indigo"  aria-label="Indigo theme"  title="Indigo"></button>
              <button class="color-theme-swatch color-theme-swatch--magenta" data-color-theme="magenta" aria-label="Magenta theme" title="Magenta"></button>
              <button class="color-theme-swatch color-theme-swatch--cyan"    data-color-theme="cyan"    aria-label="Cyan theme"    title="Cyan"></button>
              <button class="color-theme-swatch color-theme-swatch--purple"  data-color-theme="purple"  aria-label="Purple theme"  title="Purple"></button>
            </div>
          </li>
          <li class="masthead__menu-item masthead__menu-item--toggle" data-no-collapse>
            <button
              class="dark-mode-toggle"
              id="dark-mode-toggle"
              aria-label="Toggle dark mode"
              title="Toggle dark / light mode"
            >
              <i class="fas fa-sun  icon-sun"  aria-hidden="true"></i>
              <i class="fas fa-moon icon-moon" aria-hidden="true"></i>
            </button>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
