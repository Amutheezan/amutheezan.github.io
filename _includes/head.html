  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- Prevent flash of wrong theme: apply saved/system preference before first paint -->
<script>
(function () {
  var saved = null;
  try { saved = localStorage.getItem('theme'); } catch(e) {}
  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var theme = saved ? saved : (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);

  /* Restore color theme (navy / slate / dark-purple) */
  var validColors = ['navy', 'slate', 'dark-purple'];
  var savedColor = null;
  try { savedColor = localStorage.getItem('color-theme'); } catch(e) {}
  if (savedColor && validColors.indexOf(savedColor) !== -1) {
    document.documentElement.setAttribute('data-color-theme', savedColor);
  }
})();
</script>
