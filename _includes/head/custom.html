<!-- Theme init: apply saved dark/color theme before paint to prevent flash -->
<script>
(function () {
  try {
    var t = localStorage.getItem('theme');
    var c = localStorage.getItem('color-theme');
    if (t === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); }
    if (c && c !== 'default') { document.documentElement.setAttribute('data-color-theme', c); }
  } catch (e) {}
})();
</script>

<!-- Dynamic favicon: neural-net icon that matches the active color theme -->
<link rel="icon" type="image/svg+xml" id="dyn-fav" href="">
<script>
(function () {
  var light = {
    'navy':         ['#4f46e5','#7c3aed'],
    'slate':        ['#0891b2','#06b6d4'],
    'dark-purple':  ['#7c3aed','#a855f7']
  };
  var dark = {
    'navy':         ['#312e81','#6366f1'],
    'slate':        ['#0e7490','#22d3ee'],
    'dark-purple':  ['#4c1d95','#8b5cf6']
  };
  function updateFavicon() {
    var h = document.documentElement;
    var isDark = h.getAttribute('data-theme') === 'dark';
    var ct = h.getAttribute('data-color-theme') || 'navy';
    var pal = isDark ? dark : light;
    var c = pal[ct] || pal['navy'];
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">'
      + '<defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">'
      + '<stop offset="0%" stop-color="' + c[0] + '"/>'
      + '<stop offset="100%" stop-color="' + c[1] + '"/>'
      + '</linearGradient></defs>'
      + '<rect width="32" height="32" rx="7" fill="url(#g)"/>'
      + '<line x1="8" y1="10" x2="17" y2="16" stroke="rgba(255,255,255,0.60)" stroke-width="1.8"/>'
      + '<line x1="8" y1="22" x2="17" y2="16" stroke="rgba(255,255,255,0.60)" stroke-width="1.8"/>'
      + '<line x1="17" y1="16" x2="26" y2="16" stroke="rgba(255,255,255,0.60)" stroke-width="1.8"/>'
      + '<circle cx="8"  cy="10" r="3"   fill="rgba(255,255,255,0.92)"/>'
      + '<circle cx="8"  cy="22" r="3"   fill="rgba(255,255,255,0.92)"/>'
      + '<circle cx="17" cy="16" r="3.2" fill="rgba(255,255,255,0.92)"/>'
      + '<circle cx="26" cy="16" r="3"   fill="rgba(255,255,255,0.92)"/>'
      + '</svg>';
    var el = document.getElementById('dyn-fav');
    if (el) { el.href = 'data:image/svg+xml,' + encodeURIComponent(svg); }
  }
  updateFavicon();
  new MutationObserver(updateFavicon).observe(
    document.documentElement,
    { attributes: true, attributeFilter: ['data-theme','data-color-theme'] }
  );
})();
</script>
